name: Otonom E-Ticaret Günlük Botu

on:
  schedule:
    # UTC saatiyle 06:00 = Türkiye Saatiyle (UTC+3) 09:00
    - cron: '0 6 * * *'
  workflow_dispatch: # GitHub arayüzünden tek tıkla çalıştırma butonu sağlar

jobs:
  calistir:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Orkestratörü ve Departmanları Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python orchestrator.py

      - name: Çıktıları Depoya Otomatik Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily report and content generation" && git push)