name: Otonom E-Ticaret Günlük Bot

on:
  schedule:
    - cron: '0 6 * * *'  # Türkiye saati ile 09:00 (UTC 06:00)
  workflow_dispatch:     # İstediğin an Actions sekmesinden manuel çalıştırabilme imkanı

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Bot herhangi bir aşamada takılırsa maksimum 15 dakika içinde güvenli çıkış yapar
    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Otonom Koordinatörü Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python orchestrator.py